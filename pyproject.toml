[project]
name = "vibe-coding"
version = "0.1.0"
description = "Coze Vibe Coding project"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.3.14",
    "langchain-openai==1.4.1",
    "langgraph==1.2.10",
    "langgraph-checkpoint==4.1.1",
    "fastapi>=0.135.1,<1",
    "uvicorn>=0.38,<1",
    "pydantic>=2.12,<3",
    "openpyxl>=3.1,<4",
    "pypdf>=6.15.0,<7",
    "python-pptx>=1.0,<2",
    "chardet>=5.2,<6",
    "requests>=2.33,<3",
    "python-multipart>=0.0.31,<1",
    "python-dotenv>=1.2.2",
]

[tool.uv]
# 使用阿里云镜像作为默认源，替代 pypi.org
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.2,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
