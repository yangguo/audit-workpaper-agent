[project]
name = "vibe-coding"
version = "0.1.0"
description = "Coze Vibe Coding project"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.0.3",
    "langchain-openai==1.1.14",
    "langgraph==1.0.10rc1",
    "langgraph-checkpoint==4.1.1",
    "fastapi>=0.121,<1",
    "uvicorn>=0.38,<1",
    "pydantic>=2.12,<3",
    "openpyxl>=3.1,<4",
    "pypdf>=5,<6",
    "python-pptx>=1.0,<2",
    "chardet>=5.2,<6",
    "requests>=2.33.0,<3",
    "python-multipart>=0.0.31,<1",
    "python-dotenv>=1.2.2",
]

[tool.uv]
# 使用阿里云镜像作为默认源，替代 pypi.org
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
